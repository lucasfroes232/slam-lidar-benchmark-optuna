fast_lio:
  package: fast_lio
  launch_file: mapping_ouster128.launch
  config_type: yaml_runtime
  config_master: configs/fast_lio/ouster128.yaml
  config_target: src/FAST_LIO/config/ouster128.yaml
  odom_topic: /Odometry
  lidar_topic_needed: /os_cloud_node/points
  # time_offset e min_matched_poses calibrados para forest01_st_square_2022-02-08-23-14-55 (bag de 62.2s)
  # Para forest02_straight (107.18s): time_offset=1644348493.629311  min_matched_poses=600
  time_offset: 1644348493.668
  bag_duration_sec: 62.2
  min_matched_poses: 480
  tunable_params:
    - blind
    - max_iteration
    - filter_size_surf
    - filter_size_map
    - point_filter_num
  baseline:
    blind: 0.5
    max_iteration: 3
    filter_size_surf: 0.5
    filter_size_map: 0.5
    point_filter_num: 3
  search_space:
    blind: [0.1, 1.0]
    max_iteration: [1, 6]
    filter_size_surf: [0.1, 1.0]
    filter_size_map: [0.1, 1.0]
    point_filter_num: [1, 6]

lio_livox:
  package: lio_livox
  launch_file: horizon.launch
  config_type: yaml_runtime
  config_master: configs/lio_livox/horizon.yaml
  config_target: src/LIO-Livox/config/horizon_config.yaml
  odom_topic: /livox_odometry_mapped
  lidar_topic_needed: /livox/lidar
  # Para forest02_straight: time_offset=1644348482.598945  min_matched_poses=600
  time_offset: 1644348482.598945
  bag_duration_sec: 62.2
  min_matched_poses: 400
  tunable_params:
    - LidarNearestDis
    - FlatThreshold
    - NumFlat
    - KdTreeCornerOutlierDis
  baseline:
    LidarNearestDis: 1.0
    FlatThreshold: 0.02
    NumFlat: 3
    KdTreeCornerOutlierDis: 0.2
  search_space:
    LidarNearestDis: [0.3, 2.0]
    FlatThreshold: [0.005, 0.08]
    NumFlat: [1, 6]
    KdTreeCornerOutlierDis: [0.05, 0.5]

lego_loam:
  package: lego_loam
  launch_file: run.launch
  config_type: cpp_compile_time   # PRECISA recompilar a cada trial!
  config_master: configs/lego_loam/velodyne16_utility.h
  config_target: src/LeGO-LOAM/LeGO-LOAM/include/utility.h
  odom_topic: /aft_mapped_to_init
  lidar_topic_needed: /velodyne_points
  # Para forest02_straight: time_offset=-0.226  min_matched_poses=100 (bag_duration_sec=107.18)
  time_offset: -0.318
  bag_duration_sec: 62.2
  min_matched_poses: 60
  tunable_params:
    - groundScanInd
    - edgeThreshold
    - surfThreshold
    - nearestFeatureSearchSqDist
  baseline:
    groundScanInd: 7
    edgeThreshold: 0.1
    surfThreshold: 0.1
    nearestFeatureSearchSqDist: 25
  search_space:
    groundScanInd: [3, 12]
    edgeThreshold: [0.02, 0.3]
    surfThreshold: [0.02, 0.3]
    nearestFeatureSearchSqDist: [5, 50]

loam_livox:
  package: loam_livox
  launch_file: livox.launch
  config_type: yaml_runtime
  config_master: configs/loam_livox/performance_realtime.yaml
  config_target: src/loam_livox/config/performance_realtime.yaml
  odom_topic: /aft_mapped_to_init
  lidar_topic_needed: /livox/lidar
  # time_offset precisa ser recalculado depois que o dataset for restaurado (é wall-clock, muda a cada dia)
  time_offset: "dynamic"
  bag_duration_sec: 62.2
  min_matched_poses: 1000
  tunable_params:
    - livox_min_dis
    - corner_curvature
    - surface_curvature
    - mapping_plane_resolution
    - icp_maximum_iteration
  baseline:
    livox_min_dis: 0.1
    corner_curvature: 0.1
    surface_curvature: 0.005
    mapping_plane_resolution: 0.6
    icp_maximum_iteration: 15
  search_space:
    livox_min_dis: [0.05, 1.0]
    corner_curvature: [0.02, 0.3]
    surface_curvature: [0.001, 0.02]
    mapping_plane_resolution: [0.2, 1.2]
    icp_maximum_iteration: [5, 30]

liorf:
  package: liorf
  launch_file: run_lio_sam_ouster.launch
  config_type: yaml_runtime
  config_master: configs/liorf/lio_sam_ouster.yaml
  config_target: src/liorf/config/lio_sam_ouster.yaml
  odom_topic: /liorf/mapping/odometry
  lidar_topic_needed: /os_cloud_node/points
  time_offset: <calcular>
  bag_duration_sec: 62.2
  min_matched_poses: <calibrar>
  tunable_params:
    - mappingSurfLeafSize
    - surroundingKeyframeSearchRadius
    - historyKeyframeFitnessScore
    - downsampleRate
  baseline:
    mappingSurfLeafSize: 0.4
    surroundingKeyframeSearchRadius: 50.0
    historyKeyframeFitnessScore: 0.3
    downsampleRate: 2
  search_space:
    mappingSurfLeafSize: [0.1, 1.0]
    surroundingKeyframeSearchRadius: [10.0, 80.0]
    historyKeyframeFitnessScore: [0.1, 0.6]
    downsampleRate: [1, 4]